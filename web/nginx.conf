server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mesmo contrato do proxy do Vite: o front só conhece /api.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
